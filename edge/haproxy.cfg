global
    log stdout format raw local0
    stats socket /tmp/control.sock mode 600 level admin

defaults
    mode http
    log global
    timeout connect 3s
    timeout client 60s
    timeout server 60s
    option httplog
    option redispatch
    retries 2

resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    hold valid 1s

frontend operator_console
    bind :8080
    use_backend api if { path_beg /api/ }
    use_backend api if { path /health }
    default_backend ui

backend api
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server inter 1s fall 1 rise 1 resolvers docker init-addr libc,none
    server a api-a:8080 check
    server b api-b:8080 check

backend ui
    server console web:8080 check resolvers docker init-addr libc,none
