x-api: &api
  pull_policy: never
  platform: linux/amd64
  restart: unless-stopped
  stop_grace_period: 40s
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  environment:
    DB_URL: jdbc:postgresql://db:5432/positions
    DB_USER: positions
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    USERS_FILE: /run/config/users.json
    TOKEN_SECRET: ${TOKEN_SECRET:?Set TOKEN_SECRET}
  volumes:
    - ./users.json:/run/config/users.json:ro
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health"]
    interval: 2s
    timeout: 3s
    retries: 30
  mem_limit: 700m

services:
  db:
    image: postgres:16.8-alpine
    platform: linux/amd64
    pull_policy: never
    environment:
      POSTGRES_DB: positions
      POSTGRES_USER: positions
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, positions, -d, positions]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 1g
  api-a:
    <<: *api
    image: position-console-api:${API_A_VERSION:-1.0.0}
  api-b:
    <<: *api
    image: position-console-api:${API_B_VERSION:-1.0.0}
  web:
    image: position-console-web:${WEB_VERSION:-1.0.0}
    platform: linux/amd64
    pull_policy: never
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 128m
  edge:
    image: position-console-edge:1.0.0
    platform: linux/amd64
    pull_policy: never
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      api-a:
        condition: service_healthy
      api-b:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 128m

volumes:
  data: